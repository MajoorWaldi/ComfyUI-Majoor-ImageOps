name: Create Stable Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  create-release:
    needs: quality
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Create Archive
        run: |
          rm -f .mjr_channel .majoor_channel .mjr_release_channel
          zip -r ComfyUI-Majoor-ImageOps_release.zip . \
          -x "*.git/*" \
          -x ".github/*" \
          -x ".claude/*" \
          -x "*/__pycache__/*" \
          -x "node_modules/*" \
          -x "*/.pytest_cache/*" \
          -x "tests/*" \
          -x "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ComfyUI-Majoor-ImageOps_release.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-registry:
    needs: create-release
    name: Publish to Comfy Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.repository_owner == 'MajoorWaldi' }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
