name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # ------------------------------------------------------------------
  # TypeScript type-check, metadata check, build, AND frontend tests.
  # All JS/TS quality gates live here so a single red job blocks merge.
  # ------------------------------------------------------------------
  frontend:
    name: TypeScript & Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify js/ is up to date
        run: |
          git diff --exit-code js/ || (echo "::error::js/ is out of date — run 'npm run build' and commit the result" && exit 1)
      # Frontend unit tests (imageops-registry, node-modules, graph, blend goldens)
      - run: npm run test:js

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest pillow
      - name: Run unit tests
        run: |
          python -m pytest tests/unit -v

  comfy-integration:
    name: ComfyUI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only dependencies and ComfyUI
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone https://github.com/comfyanonymous/ComfyUI.git /tmp/ComfyUI
          pip install -r /tmp/ComfyUI/requirements.txt
          pip install pytest numpy pillow
      - name: Run integration tests
        env:
          COMFYUI_ROOT: /tmp/ComfyUI
        run: |
          # Copy extension to custom_nodes
          mkdir -p /tmp/ComfyUI/custom_nodes/ComfyUI-Majoor-ImageOps
          cp -r . /tmp/ComfyUI/custom_nodes/ComfyUI-Majoor-ImageOps
          python -m pytest tests/integration -v

  quality-gate:
    name: Quality Gate
    needs: [frontend, python-unit, comfy-integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All quality checks passed!"
