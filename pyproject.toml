[project]
name = "majoor-imageops"
description = "Essential Nodes Pack for Images Processing for ComfyUI, with a live embedded preview inside the node (no queue) for supported chains."
version = "0.1.5"
requires-python = ">=3.10, <3.15"
license = {file = "LICENSE"} 
authors = [
  { name = "MajoorWaldi" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: AMD ROCm",
]


[project.urls]
Homepage = "https://github.com/MajoorWaldi/ComfyUI-Majoor-ImageOps"
Repository = "https://github.com/MajoorWaldi/ComfyUI-Majoor-ImageOps"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/MajoorWaldi/ComfyUI-Majoor-ImageOps/wiki"
"Bug Tracker" = "https://github.com/MajoorWaldi/ComfyUI-Majoor-ImageOps/issues"

[tool.comfy]
PublisherId = "majoor-waldi"
DisplayName = "ComfyUI-Majoor-ImageOps"
Icon = ""
includes = [] 
# Minimum ComfyUI version required for V3 node schema (comfy_api.latest.io).
# Exact minimum will be pinned once integration tests are run against ComfyUI releases.
# "requires-comfyui" = ">=0.3.0"  # uncomment and set after integration CI is in place

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
